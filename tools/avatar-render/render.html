<!doctype html>
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent}#c{display:block}</style>
<canvas id="c" width="256" height="512"></canvas>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const W = 256, H = 512;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setSize(W, H, false);
renderer.setClearColor(0x000000, 0); // transparent

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(2, 4, 3);
scene.add(key);

const aspect = W / H;
let frustum = 0.82;     // half-height of ortho view in world units (tuned for Kenney Mini)
let lookY = 0.68;       // world-Y the camera aims at; higher => character lower in frame
// iso: azimuth 45deg, elevation ~30deg (arctan(0.5)=26.57 is true 2:1)
const cam = new THREE.OrthographicCamera(
  -frustum * aspect, frustum * aspect, frustum, -frustum, 0.1, 100,
);
cam.position.set(6, 6 * Math.tan(THREE.MathUtils.degToRad(30)) * Math.SQRT2, 6);
cam.lookAt(0, lookY, 0);

// Runtime tuning: adjust zoom (frustum) + vertical framing (lookY) without editing the file.
window.__setCam = (f, ly) => {
  frustum = f; lookY = ly;
  cam.left = -f * aspect; cam.right = f * aspect; cam.top = f; cam.bottom = -f;
  cam.updateProjectionMatrix();
  cam.lookAt(0, ly, 0);
};

const pivot = new THREE.Group(); // model goes here; yaw gives the 4 directions
scene.add(pivot);
let mixer = null, walk = null, loadedModel = null, bodyBone = null;

// World-space bounding box of only the VISIBLE meshes (ignores bone/empty nodes).
const meshWorldBox = (obj) => {
  const b = new THREE.Box3();
  obj.traverse((o) => {
    if (o.isMesh && o.geometry) {
      o.geometry.computeBoundingBox();
      b.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
    }
  });
  return b;
};

const params = new URLSearchParams(location.search);
const url = params.get('glb');
window.__animCount = -1;
new GLTFLoader().load(
  url,
  (gltf) => {
    const model = gltf.scene;
    // Model-agnostic normalization: scale ANY source (Kenney ~2u, RobotExpressive
    // ~149u, Tripo output, …) to one target height so the fixed camera/frustum
    // frames them all identically. Without this the camera (near/far 0.1..100,
    // ~10u out) is hardcoded for tiny models and clips/shrinks large ones.
    // Kenney male-a's visible-mesh height. Normalizing every model to this makes
    // the existing FRUSTUM/LOOKY tuning frame ANY source the same, and re-baking
    // the shipped Kenney avatars is a no-op (they already measure ~this).
    const TARGET_HEIGHT = 0.671;
    // Measure the VISIBLE mesh, not Box3.setFromObject — that includes bone/empty
    // nodes whose extents can dwarf the mesh (RobotExpressive: mesh ~2.6u but the
    // skeleton bbox is ~149u). Union only isMesh geometry, in world space.
    model.updateWorldMatrix(true, true);
    let box = meshWorldBox(model);
    const rawH = box.max.y - box.min.y || 1;
    window.__modelHeight = rawH;
    const baseScale = TARGET_HEIGHT / rawH;
    model.scale.setScalar(baseScale);
    model.updateWorldMatrix(true, true);
    box = meshWorldBox(model); // recompute after scaling
    model.position.y -= box.min.y; // feet at y=0
    pivot.add(model);
    loadedModel = model;
    window.__dbg = { rawH, scaledH: box.max.y - box.min.y };
    // Height-scale multiplier on top of the normalization. Models whose total
    // mesh height includes tall thin gear (antennae, hats) normalize their BODY
    // too small — this knob (or extract.sh's auto-calibration) compensates.
    window.__setHeightScale = (f) => {
      model.scale.setScalar(baseScale * f);
    };
    window.__animCount = gltf.animations.length;
    window.__animNames = gltf.animations.map((a) => a.name);
    // Body-center bone: a stable horizontal reference for centering. A full-mesh
    // AABB center is thrown off by antennae/arms (they extend asymmetrically per
    // facing → the body drifts off-frame and clips); the pelvis/hips axis is not.
    model.traverse((o) => {
      if (!bodyBone && o.isSkinnedMesh && o.skeleton) {
        const bones = o.skeleton.bones;
        bodyBone =
          bones.find((b) => /pelvis/i.test(b.name)) ||
          bones.find((b) => /hips?/i.test(b.name)) ||
          bones.find((b) => /root/i.test(b.name)) ||
          bones[0];
      }
    });
    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(model);
      walk = gltf.animations.find((a) => /walk|run/i.test(a.name)) || gltf.animations[0];
      mixer.clipAction(walk).play();
      window.__walkLen = walk.duration;
    }
    window.__renderReady = true;
  },
  undefined,
  (err) => { window.__renderError = String(err); },
);

// Global yaw offset (deg) so all 4 directions can be rotated together while
// calibrating which physical orientation maps to each se/sw/nw/ne label in-game.
window.__yawOffset = -45;

// dirIndex: 0=se,1=sw,2=nw,3=ne. animTime sec (walk phase). idle if animTime<0.
window.__renderFrame = (dirIndex, animTime) => {
  pivot.position.set(0, 0, 0);
  pivot.rotation.y = THREE.MathUtils.degToRad(45 + dirIndex * 90 + window.__yawOffset);
  if (mixer) mixer.setTime(animTime < 0 ? 0 : animTime);
  // Lock the character in place every frame — a walk clip with ROOT MOTION would
  // otherwise put the body at a different spot per sampled phase (drift/jitter).
  // Center the BODY BONE on the world vertical axis (x=z=0): that axis projects
  // to the canvas centerline AND pins the depth along camera-forward. Screen-x
  // centering alone is not enough — in a tilted ortho camera a depth offset
  // shifts screen-Y, so per-yaw depth differences made the sprite sit lower on
  // some directions (the "sinks when walking up" bug). Vertical: drop the
  // visible mesh's lowest point (feet/base) to the floor.
  if (loadedModel && bodyBone) {
    pivot.updateWorldMatrix(true, true);
    const p = new THREE.Vector3();
    bodyBone.getWorldPosition(p);
    pivot.position.x -= p.x;
    pivot.position.z -= p.z;
    pivot.updateWorldMatrix(true, true);
    const b = meshWorldBox(pivot);
    pivot.position.y -= b.min.y;
  }
  renderer.render(scene, cam);
  return canvas.toDataURL('image/png');
};

// Measure the BODY's pixel height in the last rendered frame: scan rows whose
// opaque-pixel count ≥ minPx, so thin gear (antennae) doesn't count as "top".
// Drives extract.sh's HEIGHT_SCALE=auto calibration against the Kenney ref.
window.__measureBodyH = (minPx = 40) => {
  // Re-render NOW: the WebGL buffer is cleared after present (no
  // preserveDrawingBuffer), so reading it in a later call sees blank pixels.
  renderer.render(scene, cam);
  const c2 = document.createElement('canvas');
  c2.width = W;
  c2.height = H;
  const g = c2.getContext('2d');
  g.drawImage(canvas, 0, 0);
  const d = g.getImageData(0, 0, W, H).data;
  let top = -1, bot = -1;
  for (let y = 0; y < H; y++) {
    let n = 0;
    for (let x = 0; x < W; x++) {
      if (d[(y * W + x) * 4 + 3] > 16) n++;
    }
    if (n >= minPx) { if (top < 0) top = y; bot = y; }
  }
  return bot - top + 1;
};
</script>
